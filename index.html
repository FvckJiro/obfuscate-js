<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObsessionHub Obfuscator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-900: #2a0000;
            --red-800: #4a0000;
            --red-700: #6b0000;
            --red-600: #8f0000;
            --red-500: #b30000;
            --red-400: #d4192a;
            --red-300: #ff3b4e;
            --red-glow: rgba(255, 30, 50, 0.55);
            --bg-0: #07070a;
            --bg-1: #0d0608;
            --panel: #140507;
            --border: #3a0a0d;
            --text: #f1e4e4;
            --text-dim: #a58b8c;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(ellipse 800px 500px at 50% -10%, rgba(179, 0, 0, 0.35), transparent 60%),
                radial-gradient(ellipse 600px 400px at 100% 100%, rgba(100, 0, 0, 0.25), transparent 60%),
                var(--bg-0);
            color: var(--text);
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 95%;
            max-width: 900px;
            background: linear-gradient(180deg, var(--panel), var(--bg-1));
            padding: 30px;
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow:
                0 0 0 1px rgba(255, 40, 60, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 80px -20px var(--red-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--red-300), var(--red-500), var(--red-300), transparent);
            box-shadow: 0 0 20px 2px var(--red-glow);
        }

        h1 {
            margin: 4px 0 28px;
            text-align: center;
            font-weight: 700;
            font-size: 2.1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ff5f6e, var(--red-500) 60%, var(--red-700));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 18px var(--red-glow));
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ff8f99;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #0a0304;
            color: #ff8f8f;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 18px;
            outline: none;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea::placeholder { color: #5c3a3d; }

        textarea:focus {
            border-color: var(--red-400);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 0 3px rgba(212, 25, 42, 0.25), 0 0 20px var(--red-glow);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 150px;
            padding: 13px 14px;
            background: #0a0304;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--red-400);
            box-shadow: 0 0 0 3px rgba(212, 25, 42, 0.25);
        }

        button {
            flex: 1;
            min-width: 140px;
            padding: 13px;
            border: 1px solid rgba(255, 90, 100, 0.25);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(180deg, var(--red-400), var(--red-700));
            box-shadow:
                0 4px 14px rgba(179, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 -2px 6px rgba(0, 0, 0, 0.35);
            transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            filter: brightness(1.15);
            transform: translateY(-1px);
            box-shadow:
                0 6px 20px rgba(212, 25, 42, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -2px 6px rgba(0, 0, 0, 0.35);
        }

        button:active { transform: translateY(0); filter: brightness(0.95); }

        .copy-btn { background: linear-gradient(180deg, #c62233, var(--red-900)); }
        .dl-btn { background: linear-gradient(180deg, #e0273a, var(--red-800)); }

        .footer-note {
            text-align: center;
            margin-top: 6px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--text-dim);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ObsessionHub Obfuscator</h1>

        <label for="inputScript">Input Script (Lua)</label>
        <textarea id="inputScript" placeholder="Paste your script here..."></textarea>

        <div class="controls">
            <button onclick="obfuscateScript()">1. Obfuscate</button>
            <button class="copy-btn" onclick="copyCode()">2. Copy Output</button>
        </div>

        <label for="outputScript">Obfuscated Output</label>
        <textarea id="outputScript" placeholder="Your obfuscated code will appear here..." readonly></textarea>

        <div class="controls">
            <input type="text" id="fileName" value="obsessionhub_script">
            <button class="dl-btn" onclick="downloadFile()">3. Download as .txt</button>
        </div>
    </div>

    <script>
        function obfuscateScript() {
            const input = document.getElementById('inputScript').value;
            if (!input.trim()) {
                alert("Please paste a script first.");
                return;
            }

            // The notification UI is placed inside a non-yielding thread
            const notifyLua = `task.spawn(function() pcall(function() local TS = game:GetService("TweenService") local CG = game:GetService("CoreGui") local sg = Instance.new("ScreenGui") sg.Name = "ObsessionHubProtect" sg.Parent = CG local f = Instance.new("Frame") f.Size = UDim2.new(0, 340, 0, 50) f.Position = UDim2.new(0.5, -170, 0, -60) f.BackgroundColor3 = Color3.fromRGB(18, 4, 6) f.Parent = sg local uc = Instance.new("UICorner") uc.CornerRadius = UDim.new(0, 8) uc.Parent = f local ug = Instance.new("UIGradient") ug.Color = ColorSequence.new({ColorSequenceKeypoint.new(0, Color3.fromRGB(80, 12, 16)), ColorSequenceKeypoint.new(0.5, Color3.fromRGB(32, 5, 7)), ColorSequenceKeypoint.new(1, Color3.fromRGB(10, 2, 3))}) ug.Rotation = 90 ug.Parent = f local us = Instance.new("UIStroke") us.Color = Color3.fromRGB(235, 30, 45) us.Thickness = 2 us.Parent = f local usg = Instance.new("UIGradient") usg.Color = ColorSequence.new({ColorSequenceKeypoint.new(0, Color3.fromRGB(255, 110, 120)), ColorSequenceKeypoint.new(0.5, Color3.fromRGB(200, 20, 30)), ColorSequenceKeypoint.new(1, Color3.fromRGB(255, 110, 120))}) usg.Parent = us local img = Instance.new("ImageLabel") img.AnchorPoint = Vector2.new(0, 0.5) img.Size = UDim2.new(0, 26, 0, 26) img.Position = UDim2.new(0, 14, 0.5, 0) img.BackgroundTransparency = 1 img.Image = "rbxassetid://10672728956" img.ImageColor3 = Color3.fromRGB(255, 60, 72) img.Parent = f local txt = Instance.new("TextLabel") txt.AnchorPoint = Vector2.new(0, 0.5) txt.Size = UDim2.new(1, -64, 0, 20) txt.Position = UDim2.new(0, 54, 0.5, 0) txt.BackgroundTransparency = 1 txt.Text = "This script is protected by ObsessionHub" txt.TextColor3 = Color3.fromRGB(255, 235, 235) txt.Font = Enum.Font.GothamBold txt.TextSize = 14 txt.TextXAlignment = Enum.TextXAlignment.Left txt.TextYAlignment = Enum.TextYAlignment.Center txt.TextScaled = false txt.TextWrapped = false txt.Parent = f local tsc = Instance.new("UITextSizeConstraint") tsc.MaxTextSize = 14 tsc.MinTextSize = 10 tsc.Parent = txt txt.TextScaled = true TS:Create(f, TweenInfo.new(0.5, Enum.EasingStyle.Quint, Enum.EasingDirection.Out), {Position = UDim2.new(0.5, -170, 0, 40)}):Play() task.wait(3.5) local tf = TweenInfo.new(1.5, Enum.EasingStyle.Linear) TS:Create(f, tf, {BackgroundTransparency = 1}):Play() TS:Create(us, tf, {Transparency = 1}):Play() TS:Create(img, tf, {ImageTransparency = 1}):Play() TS:Create(txt, tf, {TextTransparency = 1}):Play() task.wait(1.5) sg:Destroy() end) end)\n`;

            // Merge the notification logic with the user's script
            const combinedScript = notifyLua + "\n" + input;

            let byteList = [];
            for (let i = 0; i < combinedScript.length; i++) {
                byteList.push(combinedScript.charCodeAt(i));
            }
            const byteString = byteList.join(',');

            // Clean wrapper - no plain text UI code visible
            const obsessionHubHeader = `-- obsessionhub\n`;
            const luaWrapper = `local _e = {${byteString}}\n` +
                               `local _t = {}\n` +
                               `for i, v in ipairs(_e) do _t[i] = string.char(v) end\n` +
                               `local _s = table.concat(_t)\n` +
                               `local _f, _err = loadstring(_s)\n` +
                               `if _f then\n` +
                               `    _f()\n` +
                               `else\n` +
                               `    error("ObsessionHub Execution Failed: " .. tostring(_err))\n` +
                               `end`;

            document.getElementById('outputScript').value = obsessionHubHeader + luaWrapper;
        }

        function copyCode() {
            const outputText = document.getElementById('outputScript');
            const text = outputText.value;
            if (!text) return;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("Copied to clipboard! (" + text.length + " characters)");
                }).catch(() => {
                    fallbackCopy(outputText, text);
                });
            } else {
                fallbackCopy(outputText, text);
            }
        }

        function fallbackCopy(outputText, text) {
            outputText.focus();
            outputText.select();
            outputText.setSelectionRange(0, text.length);
            const ok = document.execCommand("copy");
            if (ok) {
                alert("Copied to clipboard! (" + text.length + " characters)");
            } else {
                alert("Copy failed. Select the text manually (Ctrl+A / Cmd+A) and copy it.");
            }
        }

        function downloadFile() {
            const outputText = document.getElementById('outputScript').value;
            let fileName = document.getElementById('fileName').value.trim();

            if (!outputText) {
                alert("Please obfuscate a script first.");
                return;
            }
            if (!fileName) {
                fileName = "obsessionhub_script";
            }
            if (!fileName.endsWith('.txt') && !fileName.endsWith('.lua')) {
                fileName += '.txt';
            }

            const blob = new Blob([outputText], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');

            a.style.display = 'none';
            a.href = url;
            a.download = fileName;

            document.body.appendChild(a);
            a.click();

            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
